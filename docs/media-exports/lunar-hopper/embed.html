<!-- Example snippet. Paths are relative to docs/media-exports/lunar-hopper/. -->
<link rel="stylesheet" href="hopper.css">
<div class="hopper-media" data-hopper role="group" aria-label="Lunar hopper round trip over mapped lunar terrain">
  <img data-poster src="../../../assets/img/lunar-hopper/hopper-poster.webp" width="1600" height="900" alt="Saved lunar hopper flight over mapped terrain">
  <video hidden muted loop playsinline preload="none" data-src="../../../assets/video/lunar-hopper/hopper-trajectory.webm" width="1600" height="900" aria-label="Animated trajectory with moving vehicle and thrust indicator"></video>
  <img hidden data-animation data-src="../../../assets/img/lunar-hopper/hopper-trajectory.webp" width="960" height="540" alt="Animated trajectory with moving vehicle and thrust indicator">
  <button type="button">Play animation</button>
</div>
<script type="module" src="hopper.js"></script>
<picture>
  <source srcset="../../../assets/img/lunar-hopper/gn-touchdown-dispersion.webp" type="image/webp">
  <img src="../../../assets/img/lunar-hopper/gn-touchdown-dispersion.png" width="2250" height="1470" alt="GN touchdown navigation-error distributions" loading="lazy" decoding="async">
</picture>
